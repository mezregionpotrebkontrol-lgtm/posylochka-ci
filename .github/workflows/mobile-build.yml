name: Mobile App Build (Android / iOS)

'on':
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch: {}

jobs:
  android-twa:
    name: Android (TWA — real Chrome rendering, for RuStore / Google Play)
    runs-on: ubuntu-latest
    if: ${{ vars.HAS_ANDROID_SIGNING == 'true' }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Install a fresh Android SDK (cmdline-tools) for Bubblewrap
        shell: bash
        run: |
          set -o pipefail
          ( set -ex
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd "$SDK_ROOT/cmdline-tools"
            curl -sS -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            rm cmdline-tools.zip
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            ln -s "$SDK_ROOT/cmdline-tools/latest" "$SDK_ROOT/tools"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          ) 2>&1 | tee sdk-install.log

      - name: Point Bubblewrap at the JDK/Android SDK (skip interactive setup)
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Using Android SDK at: $ANDROID_HOME"
          ls "$ANDROID_HOME"
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Build signed TWA APK with Bubblewrap
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          npx @bubblewrap/cli build --skipPwaValidation 2>&1 | tee build.log

      - name: Publish logs to a GitHub Release (always, for debugging)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          : > combined-logs.txt
          for f in sdk-install.log build.log; do
            if [ -f "$f" ]; then
              echo "===== $f =====" >> combined-logs.txt
              cat "$f" >> combined-logs.txt
            fi
          done
          gh release delete build-logs --yes --cleanup-tag || true
          gh release create build-logs combined-logs.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Логи последней сборки (для отладки)" \
            --notes "Служебный файл для отладки сборки." || true

      - name: Publish APK to a public GitHub Release (no login needed to download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app-release-signed.apk posylochka-latest.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build posylochka-latest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Последняя сборка приложения (TWA)" \
            --notes "Скачайте posylochka-latest.apk и установите на Android-телефон. Открывает сайт в полноценном Chrome внутри приложения — без лишнего масштабирования."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: posylochka-android-twa-signed
          path: mobile-app/app-release-signed.apk

  ios:
    name: iOS (simulator build check)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate icons & splash screens
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#0A2472' --splashBackgroundColor '#0A2472'

      - name: Sync web assets into native project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: mobile-app/ios/App
        run: pod install

      - name: Build for iOS Simulator (unsigned, validates the project compiles)
        working-directory: mobile-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
