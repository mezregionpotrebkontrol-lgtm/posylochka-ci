name: Mobile App Build (Android / iOS)

'on':
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch: {}

jobs:
  android-debug:
    name: Android (debug APK — для быстрой проверки на телефоне)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app version (versionCode/versionName)
        working-directory: mobile-app/android/app
        run: |
          # Capacitor's generated build.gradle always has a line "versionCode <N>" and
          # "versionName \"<X.Y.Z>\"" inside defaultConfig, but the exact default number can
          # change between Capacitor releases — match by pattern, not by an exact literal,
          # so this step never silently no-ops if the generated default changes.
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ vars.ANDROID_VERSION_CODE || 8 }}/' build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "${{ vars.ANDROID_VERSION_NAME || '2.1.0' }}"/' build.gradle
          echo "--- итоговая версия в build.gradle ---"
          grep -E 'versionCode|versionName' build.gradle
          # Жёсткая проверка: если версия не совпала с ожидаемой — останавливаем сборку,
          # чтобы не отправить в RuStore APK со старым versionCode (конфликт с версией 7).
          grep -qE 'versionCode +${{ vars.ANDROID_VERSION_CODE || 8 }}\b' build.gradle || { echo "::error::versionCode не обновился — проверьте шаблон build.gradle"; exit 1; }

      - name: Generate icons & splash screens
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' --splashBackgroundColor '#0A2472' --splashBackgroundColorDark '#0A2472'

      - name: Sync web assets into native project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK to a public GitHub Release (no login needed to download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$apk" posylochka-debug-latest.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build posylochka-debug-latest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Последняя тестовая сборка (debug, Capacitor)" \
            --notes "Скачайте posylochka-debug-latest.apk и установите на Android-телефон — проверьте, что сайт внутри приложения выглядит так же, как в Chrome, перед отправкой в RuStore."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: posylochka-android-debug
          path: mobile-app/android/app/build/outputs/apk/debug/*.apk

  android-release:
    name: Android (signed release APK for RuStore / Google Play)
    runs-on: ubuntu-latest
    if: ${{ vars.HAS_ANDROID_SIGNING == 'true' }}
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set app version (versionCode/versionName)
        working-directory: mobile-app/android/app
        run: |
          # Capacitor's generated build.gradle always has a line "versionCode <N>" and
          # "versionName \"<X.Y.Z>\"" inside defaultConfig, but the exact default number can
          # change between Capacitor releases — match by pattern, not by an exact literal,
          # so this step never silently no-ops if the generated default changes.
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ vars.ANDROID_VERSION_CODE || 8 }}/' build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "${{ vars.ANDROID_VERSION_NAME || '2.1.0' }}"/' build.gradle
          echo "--- итоговая версия в build.gradle ---"
          grep -E 'versionCode|versionName' build.gradle
          # Жёсткая проверка: если версия не совпала с ожидаемой — останавливаем сборку,
          # чтобы не отправить в RuStore APK со старым versionCode (конфликт с версией 7).
          grep -qE 'versionCode +${{ vars.ANDROID_VERSION_CODE || 8 }}\b' build.gradle || { echo "::error::versionCode не обновился — проверьте шаблон build.gradle"; exit 1; }

      - name: Generate icons & splash screens
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' --splashBackgroundColor '#0A2472' --splashBackgroundColorDark '#0A2472'

      - name: Sync web assets into native project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        working-directory: mobile-app/android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Add signing config to build.gradle
        working-directory: mobile-app/android
        run: |
          cat >> app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release APK
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: posylochka-android-release-signed
          path: mobile-app/android/app/build/outputs/apk/release/*.apk

  ios:
    name: iOS (simulator build check)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate icons & splash screens
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#0A2472'

      - name: Sync web assets into native project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: mobile-app/ios/App
        run: pod install

      - name: Build for iOS Simulator (unsigned, validates the project compiles)
        working-directory: mobile-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
