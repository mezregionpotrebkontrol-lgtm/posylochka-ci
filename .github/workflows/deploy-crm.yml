name: Deploy CRM to hosting (FTP)

'on':
  push:
    branches:
      - main
    paths:
      - 'crm/**'
  workflow_dispatch: {}

jobs:
  deploy:
    name: Upload crm/ to server over FTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy payload (config.php stays server-only, never overwritten)
        run: |
          set -e
          rm -rf deploy_crm
          cp -r crm deploy_crm
          # config.php on the live server has real secrets (DB password, YooKassa key,
          # Green API tokens, etc.) that are NOT the same as what's in this git repo --
          # never let a deploy overwrite it.
          rm -f deploy_crm/config.php

      - name: Upload crm/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 21 }}
          protocol: ftp
          local-dir: ./deploy_crm/
          server-dir: ${{ secrets.DEPLOY_REMOTE_PATH }}/
          exclude: |
            **/config.php
