name: Deploy CRM to hosting (SFTP)

'on':
  push:
    branches:
      - main
    paths:
      - 'crm/**'
  workflow_dispatch: {}

jobs:
  deploy:
    name: Upload crm/ to server over SFTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy payload (config.php stays server-only, never overwritten)
        run: |
          set -e
          rm -rf deploy_crm
          cp -r crm deploy_crm
          # config.php on the live server has real secrets (DB password, YooKassa key,
          # Green API tokens, etc.) that are NOT the same as what's in this git repo --
          # never let a deploy overwrite it.
          rm -f deploy_crm/config.php

      - name: Upload crm/ via SCP/SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: 'deploy_crm/*'
          target: ${{ secrets.DEPLOY_REMOTE_PATH }}
          strip_components: 1
          overwrite: true
